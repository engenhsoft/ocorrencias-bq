name: Publicar OCORRÊNCIAS B&Q

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node para regressões do frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar retomada da foto Fiscal
        timeout-minutes: 2
        run: node tests/fiscal-photo-resume.mjs
      - name: Validar API e IndexedDB
        timeout-minutes: 2
        run: node tests/audit-regression.mjs
      - name: Validar etapas
        timeout-minutes: 2
        run: node tests/stage-validation.mjs --behavior-only
      - name: Validar estabilidade operacional
        timeout-minutes: 2
        run: node tests/operational-stability.mjs
      - name: Validar preços
        timeout-minutes: 2
        run: node tests/contract-pricing.mjs
      - name: Validar materiais
        timeout-minutes: 2
        run: node tests/material-catalog.mjs
      - name: Validar auditoria de integridade e segurança
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/occbq-audit-deps" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.6
          NODE_PATH="$RUNNER_TEMP/occbq-audit-deps/node_modules" node tests/run-audit-20261018.mjs
          NODE_PATH="$RUNNER_TEMP/occbq-audit-deps/node_modules" node tests/correction-deadline.mjs
      - name: Validar concorrência e recuperação operacional
        timeout-minutes: 3
        run: |
          node tests/stability-audit.mjs
          node tests/stability-sweep.mjs
          node tests/supervisor-load-completion.mjs
      - name: Validar CHAVES e compatibilidade histórica
        timeout-minutes: 2
        run: node tests/chaves-core.mjs
      - name: Validar release PWA
        timeout-minutes: 2
        run: node tests/pwa-release.mjs
      - name: Validar integridade estática
        timeout-minutes: 2
        run: node tests/static-audit.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .
      - name: Confirmar registro do pacote
        uses: actions/github-script@v7
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 0; attempt < 8; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, name
              });
              const found = data.artifacts.filter(item => item.name === name && !item.expired);
              if (found.length === 1) {
                core.info(`Pacote confirmado: ${name} (ID ${found[0].id})`);
                return;
              }
              if (found.length > 1) throw new Error(`Pacote duplicado: ${name}`);
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error(`Pacote ainda indisponível para publicação: ${name}`);
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
