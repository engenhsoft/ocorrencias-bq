name: Publicar OCORRÊNCIAS B&Q

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node para regressões do frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar frontend antes de publicar
        run: |
          node tests/fiscal-photo-resume.mjs
          node tests/audit-regression.mjs
          node tests/stage-validation.mjs --behavior-only
          node tests/operational-stability.mjs
          node tests/contract-pricing.mjs
          node tests/material-catalog.mjs
          node tests/pwa-release.mjs
          node tests/static-audit.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
