name: Publicar OCORRÊNCIAS B&Q

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node para regressões do frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar retomada da foto Fiscal
        timeout-minutes: 2
        run: node tests/fiscal-photo-resume.mjs
      - name: Validar API e IndexedDB
        timeout-minutes: 2
        run: node tests/audit-regression.mjs
      - name: Validar etapas
        timeout-minutes: 2
        run: node tests/stage-validation.mjs --behavior-only
      - name: Validar estabilidade operacional
        timeout-minutes: 2
        run: node tests/operational-stability.mjs
      - name: Validar preços
        timeout-minutes: 2
        run: node tests/contract-pricing.mjs
      - name: Validar materiais
        timeout-minutes: 2
        run: node tests/material-catalog.mjs
      - name: Validar release PWA
        timeout-minutes: 2
        run: node tests/pwa-release.mjs
      - name: Validar integridade estática
        timeout-minutes: 2
        run: node tests/static-audit.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
